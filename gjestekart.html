<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Utforsk området – Falstad Hotell</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@400;600&display=swap');
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --brand:#a0af28;--brand2:#7a8a1e;
      --cream:#F0EDE4;--cream2:#E8E4D8;
      --white:#FAFAF7;--ink:#181a1c;--muted:#787060;--rule:#C8C2B0;
      --cat-restaurant:#9B6B2A;--cat-natur:#5A7A20;
      --cat-kultur:#2C4A6A;--cat-shopping:#6B5080;--cat-krig:#ca5347;
    }
    html,body{height:100%;font-family:'Barlow',sans-serif;background:var(--cream);color:var(--ink)}

    /* HEADER */
    header{background:var(--brand);padding:10px 18px;display:flex;align-items:center;gap:14px;z-index:1000;position:relative}
    header img{height:48px;width:auto;display:block;flex-shrink:0}
    .hd{flex:1;border-left:1px solid rgba(255,255,255,.3);padding-left:14px;min-width:0}
    .hd-sub{font-size:.6rem;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.75)}
    .hd-link{font-size:.78rem;color:rgba(255,255,255,.9);text-decoration:none;font-weight:500;margin-top:3px;display:block}
    .hd-link:hover{text-decoration:underline}
    /* language switcher */
    .lang-switcher{display:flex;gap:4px;flex-shrink:0}
    .lang-btn{padding:4px 9px;border-radius:2px;border:1px solid rgba(255,255,255,.35);
      font-size:.7rem;font-weight:600;font-family:'Barlow',sans-serif;cursor:pointer;
      background:transparent;color:rgba(255,255,255,.7);transition:all .14s;letter-spacing:.05em}
    .lang-btn:hover{border-color:#fff;color:#fff}
    .lang-btn.active{background:rgba(255,255,255,.22);border-color:rgba(255,255,255,.6);color:#fff}

    /* FILTER BAR */
    .filters{display:flex;gap:6px;padding:9px 14px;background:var(--white);
      border-bottom:1px solid var(--rule);overflow-x:auto;scrollbar-width:none;
      position:sticky;top:0;z-index:999}
    .filters::-webkit-scrollbar{display:none}
    .filter-btn{flex-shrink:0;display:flex;align-items:center;gap:6px;padding:5px 12px;
      border-radius:2px;border:1px solid var(--rule);font-size:.74rem;font-weight:500;
      font-family:'Barlow',sans-serif;cursor:pointer;background:transparent;color:var(--muted);transition:all .14s}
    .filter-btn:hover{border-color:var(--ink);color:var(--ink)}
    .filter-btn.active{color:#fff;border-color:transparent}
    .filter-btn[data-cat="alle"].active     {background:var(--brand)}
    .filter-btn[data-cat="restaurant"].active{background:var(--cat-restaurant)}
    .filter-btn[data-cat="natur"].active    {background:var(--cat-natur)}
    .filter-btn[data-cat="kultur"].active   {background:var(--cat-kultur)}
    .filter-btn[data-cat="shopping"].active {background:var(--cat-shopping)}
    .filter-btn[data-cat="krig"].active     {background:var(--cat-krig)}
    .filter-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}

    /* LAYOUT */
    .layout{display:flex;flex-direction:column;height:calc(100vh - 116px)}
    @media(min-width:720px){.layout{flex-direction:row}}
    #map{flex:1 1 auto;min-height:300px}

    /* SIDEBAR */
    .sidebar{width:100%;max-height:42vh;overflow-y:auto;background:var(--white);
      border-top:1px solid var(--rule);scrollbar-width:thin;scrollbar-color:var(--rule) transparent}
    @media(min-width:720px){.sidebar{width:292px;max-height:none;border-top:none;border-left:1px solid var(--rule)}}
    .sidebar-section-label{font-size:.59rem;font-weight:600;letter-spacing:.18em;text-transform:uppercase;
      color:var(--muted);padding:11px 15px 3px;border-top:1px solid var(--rule)}
    .sidebar-section:first-child .sidebar-section-label{border-top:none}
    .poi-card{display:flex;align-items:flex-start;gap:10px;padding:8px 15px;
      cursor:pointer;transition:background .1s;border-left:2px solid transparent}
    .poi-card:hover{background:var(--cream)}
    .poi-card.selected{background:var(--cream2)}
    .poi-card[data-cat="restaurant"].selected{border-left-color:var(--cat-restaurant)}
    .poi-card[data-cat="natur"].selected{border-left-color:var(--cat-natur)}
    .poi-card[data-cat="kultur"].selected{border-left-color:var(--cat-kultur)}
    .poi-card[data-cat="shopping"].selected{border-left-color:var(--cat-shopping)}
    .poi-card[data-cat="krig"].selected{border-left-color:var(--cat-krig)}
    .poi-icon{width:26px;height:26px;border-radius:2px;display:flex;align-items:center;
      justify-content:center;font-size:13px;flex-shrink:0;margin-top:1px;background:var(--cream)}
    .poi-info{flex:1;min-width:0}
    .poi-name{font-family:'Roboto',sans-serif;font-weight:600;font-size:.93rem;color:var(--ink);
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}
    .poi-desc{font-size:.7rem;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

    /* POPUP */
    .leaflet-popup-content-wrapper{background:var(--white)!important;border:1px solid var(--rule)!important;
      border-radius:2px!important;box-shadow:0 4px 20px rgba(0,0,0,.12)!important;padding:0!important;overflow:hidden}
    .leaflet-popup-tip{background:var(--white)!important}
    .leaflet-popup-content{margin:0!important;min-width:210px;max-width:260px}
    .popup-body{padding:13px 15px}
    .popup-title{font-family:'Roboto',sans-serif;font-size:1.02rem;font-weight:600;color:var(--ink);line-height:1.2}
    .popup-cat{font-size:.6rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:3px}
    .popup-note{font-size:.76rem;color:var(--muted);margin-top:7px;line-height:1.45}
    .popup-divider{border:none;border-top:1px solid var(--rule)}
    .popup-actions{display:flex}
    .popup-btn{flex:1;text-align:center;padding:8px 0;font-size:.72rem;font-weight:600;
      text-decoration:none;transition:background .12s;color:var(--ink);background:var(--cream)}
    .popup-btn:hover{background:var(--cream2)}
    .popup-btn+.popup-btn{border-left:1px solid var(--rule)}
    .popup-btn-nav{color:var(--brand2)}

    @media print{
      .filters,.sidebar,.lang-switcher{display:none!important}
      .layout{height:auto}
      #map{height:90vh!important}
      header{-webkit-print-color-adjust:exact;print-color-adjust:exact}
    }
  </style>
</head>

const CAT_COLORS={restaurant:'#9B6B2A',natur:'#5A7A20',kultur:'#2C4A6A',shopping:'#6B5080',krig:'#ca5347'};
const HOTEL={lat:63.6914628,lng:11.0417501};

// ── MAP ───────────────────────────────────────────────────────────────────────
const map=L.map('map').setView([63.6914,11.0416],13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  attribution:'© <a href="https://openstreetmap.org">OpenStreetMap</a>',maxZoom:19
}).addTo(map);

const hotelIcon=L.divIcon({className:'',
  html:`<div style="width:36px;height:36px;background:#a0af28;border:3px solid #fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:0 0 0 3px #a0af28,0 3px 12px rgba(0,0,0,.35);position:relative">🏨<div style="position:absolute;bottom:-7px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-top:9px solid #a0af28"></div></div>`,
  iconSize:[36,45],iconAnchor:[18,45]});
const hotelMarker=L.marker([HOTEL.lat,HOTEL.lng],{icon:hotelIcon}).addTo(map);
hotelMarker.bindPopup(()=>`<div class="popup-body"><div class="popup-title">Falstad Hotell</div><div class="popup-cat">${t('youAreHere')}</div></div>`);

let activeFilter='alle',markers={},selectedId=null;

function makeMarkerIcon(poi,highlight){
  const color=CAT_COLORS[poi.cat]||'#888';
  const s=highlight?34:26;
  // war memorials get a slightly different shape: diamond-ish
  const br=poi.cat==='krig'?'50% 0 50% 0':'2px';
  return L.divIcon({className:'',
    html:`<div style="width:${s}px;height:${s}px;background:${color};border:2px solid #FAFAF7;border-radius:${br};display:flex;align-items:center;justify-content:center;font-size:${highlight?16:12}px;box-shadow:0 2px ${highlight?10:4}px rgba(0,0,0,${highlight?.28:.15})">${poi.icon}</div>`,
    iconSize:[s,s],iconAnchor:[s/2,s/2]});
}

function buildPopup(poi){
  const navUrl=`https://www.google.com/maps/dir/?api=1&destination=${poi.lat},${poi.lng}`;
  return `<div class="popup-body">
    <div class="popup-title">${poi.icon} ${poi.name}</div>
    <div class="popup-cat">${tLabel(poi.cat)}</div>
    <div class="popup-note">${poiNote(poi)}</div>
  </div>
  <hr class="popup-divider">
  <div class="popup-actions">
    <a href="${navUrl}" target="_blank" class="popup-btn popup-btn-nav">${t('navigate')}</a>
    <a href="${poi.maps}" target="_blank" class="popup-btn">${t('moreInfo')}</a>
  </div>`;
}

POIS.forEach(poi=>{
  const m=L.marker([poi.lat,poi.lng],{icon:makeMarkerIcon(poi,false)}).addTo(map);
  m.bindPopup(()=>buildPopup(poi),{maxWidth:260});
  m.on('click',()=>selectPoi(poi.id));
  markers[poi.id]=m;
});

function selectPoi(id){
  selectedId=id;
  POIS.forEach(p=>{if(markers[p.id])markers[p.id].setIcon(makeMarkerIcon(p,p.id===id));});
  document.querySelectorAll('.poi-card').forEach(el=>el.classList.toggle('selected',parseInt(el.dataset.id)===id));
  const card=document.querySelector(`.poi-card[data-id="${id}"]`);
  if(card)card.scrollIntoView({behavior:'smooth',block:'nearest'});
}

function renderSidebar(){
  const inner=document.getElementById('sidebarInner');
  const cats=activeFilter==='alle'?['restaurant','natur','kultur','krig','shopping']:[activeFilter];
  inner.innerHTML='';
  cats.forEach(cat=>{
    const items=POIS.filter(p=>p.cat===cat);
    if(!items.length)return;
    const sec=document.createElement('div');sec.className='sidebar-section';
    sec.innerHTML=`<div class="sidebar-section-label" style="color:${CAT_COLORS[cat]||'#888'}">${tLabel(cat)} (${items.length})</div>`;
    items.forEach(poi=>{
      const card=document.createElement('div');
      card.className='poi-card';card.dataset.id=poi.id;card.dataset.cat=poi.cat;
      if(poi.id===selectedId)card.classList.add('selected');
      const noteShort=poiNote(poi).substring(0,55);
      card.innerHTML=`<div class="poi-icon">${poi.icon}</div><div class="poi-info"><div class="poi-name">${poi.name}</div><div class="poi-desc">${noteShort}…</div></div>`;
      card.addEventListener('click',()=>{
        selectPoi(poi.id);map.setView([poi.lat,poi.lng],14,{animate:true});markers[poi.id].openPopup();
      });
      sec.appendChild(card);
    });
    inner.appendChild(sec);
  });
}

// ── FILTERS ───────────────────────────────────────────────────────────────────
document.querySelectorAll('.filter-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    activeFilter=btn.dataset.cat;
    document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    POIS.forEach(poi=>{
      const vis=activeFilter==='alle'||poi.cat===activeFilter;
      if(vis){if(!map.hasLayer(markers[poi.id]))markers[poi.id].addTo(map);}
      else{if(map.hasLayer(markers[poi.id]))map.removeLayer(markers[poi.id]);}
    });
    renderSidebar();
  });
});

// ── LANGUAGE SWITCHER ─────────────────────────────────────────────────────────
document.querySelectorAll('.lang-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    lang=btn.dataset.lang;
    document.documentElement.lang=lang;
    document.querySelectorAll('.lang-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    applyLang();
  });
});

renderSidebar();
</script>
</body>
</html>
